name: Build & Publish Docker Image

on:
  push:
    branches: ["main", "dev"]
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract release tag
        id: vars
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ format('{0}/{1}:latest', secrets.DOCKERHUB_USERNAME, github.event.repository.name) }}
            ${{ github.ref == 'refs/heads/dev' && format('{0}/{1}:dev', secrets.DOCKERHUB_USERNAME, github.event.repository.name) || '' }}
            ${{ github.ref_type == 'tag' && format('{0}/{1}:{2}', secrets.DOCKERHUB_USERNAME, github.event.repository.name, steps.vars.outputs.tag) || '' }}
